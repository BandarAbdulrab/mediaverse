map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name ORIGIN_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ORIGIN_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/ORIGIN_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ORIGIN_DOMAIN/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 20M;

    # Security headers (location blocks that call add_header must repeat these)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy headers, inherited by every location below
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_buffering off;               # stream directly; avoids spooling big files to disk

    # Default: login, API, everything dynamic (CloudFront passes these through uncached)
    location / {
        proxy_pass http://jellyfin:8096;
    }

    # Real-time playback state / remote control
    location /socket {
        proxy_pass http://jellyfin:8096;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Static web client: safe to cache
    location /web/ {
        proxy_pass http://jellyfin:8096;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400";   # added on 200/206/304 only
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Video streams: cacheable per token (the CloudFront cache key includes the token)
    location /Videos/ {
        proxy_pass http://jellyfin:8096;
        proxy_read_timeout 300s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400";   # error responses (401/404) get no cache header
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}